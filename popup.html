<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Wallet Watch</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="url(#g)" stroke-width="2.5" />
          <circle cx="16" cy="16" r="4.5" fill="url(#g)" />
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0%" stop-color="#f5da84" />
              <stop offset="55%" stop-color="#d4af37" />
              <stop offset="100%" stop-color="#a67c1a" />
            </linearGradient>
          </defs>
        </svg>
        <span>Wallet Watch</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg height="512" viewBox="0 0 32 32" width="512" xmlns="http://www.w3.org/2000/svg" id="fi_3019014">
            <g id="Layer_2" data-name="Layer 2">
              <path
                d="m29.21 11.84a3.92 3.92 0 0 1 -3.09-5.3 1.84 1.84 0 0 0 -.55-2.07 14.75 14.75 0 0 0 -4.4-2.55 1.85 1.85 0 0 0 -2.09.58 3.91 3.91 0 0 1 -6.16 0 1.85 1.85 0 0 0 -2.09-.58 14.82 14.82 0 0 0 -4.1 2.3 1.86 1.86 0 0 0 -.58 2.13 3.9 3.9 0 0 1 -3.25 5.36 1.85 1.85 0 0 0 -1.62 1.49 14.14 14.14 0 0 0 -.28 2.8 14.32 14.32 0 0 0 .19 2.35 1.85 1.85 0 0 0 1.63 1.55 3.9 3.9 0 0 1 3.18 5.51 1.82 1.82 0 0 0 .51 2.18 14.86 14.86 0 0 0 4.36 2.51 2 2 0 0 0 .63.11 1.84 1.84 0 0 0 1.5-.78 3.87 3.87 0 0 1 3.2-1.68 3.92 3.92 0 0 1 3.14 1.58 1.84 1.84 0 0 0 2.16.61 15 15 0 0 0 4-2.39 1.85 1.85 0 0 0 .54-2.11 3.9 3.9 0 0 1 3.13-5.39 1.85 1.85 0 0 0 1.57-1.52 14.5 14.5 0 0 0 .26-2.53 14.35 14.35 0 0 0 -.25-2.67 1.83 1.83 0 0 0 -1.54-1.49zm-8.21 4.16a5 5 0 1 1 -5-5 5 5 0 0 1 5 5z">
              </path>
            </g>
          </svg>
        </button>
        <button id="btn-refresh" class="icon-btn" title="Refresh balances" aria-label="Refresh balances">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.6-6.4" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-label">Total balance</div>
      <div class="hero-value" id="total-value">$0.00</div>
      <div class="hero-meta" id="total-meta">No wallets yet</div>
    </section>

    <section class="panel" id="panel-add" hidden>
      <div class="field">
        <label for="input-label">Label</label>
        <input id="input-label" type="text" placeholder="Cold storage" maxlength="40" autocomplete="off" />
      </div>
      <div class="field">
        <label for="input-address">Public address</label>
        <input id="input-address" type="text" placeholder="0x… / T… / bc1… / …" spellcheck="false" autocomplete="off" />
      </div>
      <div class="detect" id="detect-output">
        <span class="detect-hint">Paste an address to detect its networks.</span>
      </div>
      <div class="form-actions">
        <button id="btn-cancel-add" class="btn ghost">Cancel</button>
        <button id="btn-save-wallet" class="btn primary" disabled>Add wallet</button>
      </div>
      <p class="form-error" id="add-error" hidden></p>
    </section>

    <section class="panel" id="panel-settings" hidden>
      <div class="setting-row">
        <label for="set-refresh">Auto refresh</label>
        <select id="set-refresh">
          <option value="0">Off</option>
          <option value="5">Every 5 min</option>
          <option value="10">Every 10 min</option>
          <option value="30">Every 30 min</option>
          <option value="60">Every hour</option>
        </select>
      </div>
      <div class="setting-row">
        <label for="set-dust">Hide dust</label>
        <input id="set-dust" type="checkbox" class="switch" />
      </div>
      <div class="setting-row">
        <label for="set-threshold">Dust below (USD)</label>
        <input id="set-threshold" type="number" min="0" step="0.1" />
      </div>
      <div class="setting-row">
        <label for="set-badge">Show total on icon</label>
        <input id="set-badge" type="checkbox" class="switch" />
      </div>
    </section>

    <main id="wallet-list" class="wallet-list"></main>

    <footer class="footer">
      <span class="stamp" id="stamp"></span>
      <button id="btn-add" class="btn primary compact">+ Add wallet</button>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>

</html>
